# The exact toolchain FanRGB is built, tested and released with (rustc 1.91.1, 2025-11-07). rustup
# installs it on first use, in CI and on the dev PC alike; bump it in its own commit, with CI green.
# rustfmt and clippy come with it (the CI fmt / clippy jobs, and `cargo fmt` locally).
[toolchain]
channel = "1.91.1"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc"]
profile = "minimal"
