# Weekly signed "latest vendor driver versions" catalog for FanRGB (src/drivers/catalog).
#
#   fetch    contents: read, no secrets   reads the vendor pages, builds catalog/drivers.json (unsigned)
#   publish  contents: write + the key    re-validates, signs with CATALOG_MINISIGN_KEY, commits to `catalog`
#   report   issues: write                opens/updates/closes one issue per failing adapter
#
# The job that parses untrusted vendor HTML never sees the signing key or a write token. The catalog goes
# to the dedicated `catalog` branch only (never main or a code branch). Scheduled workflows run only from
# the default branch: this file must be on `main` for the cron to fire (workflow_dispatch works from any
# branch that has it).

name: Driver catalog

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      allow_downgrade:
        description: "Comma-separated entry ids that may get a lower version than published"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build, validate and sign, but do not commit to the catalog branch"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: driver-catalog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch:
    name: Fetch vendor versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the published catalog
        id: published
        continue-on-error: true # the branch does not exist before the first run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: catalog
          path: published
          persist-credentials: false

      - name: Build the catalog (unsigned)
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          args=(build --repo-root . --out out --save-pages pages --allow-downgrade "${ALLOW_DOWNGRADE:-}")
          if [ -f published/catalog/drivers.json ]; then args+=(--previous published/catalog/drivers.json); fi
          status=0
          python3 -I tools/driver-catalog/catalog.py "${args[@]}" || status=$?
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Upload the unsigned catalog and the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-unsigned
          path: out/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the fetched vendor pages (for fixing a parser)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-pages
          path: pages/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Validate, sign and publish
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CATALOG_MINISIGN_KEY must be a secret of this *environment*, not of the repository, and the
    # environment's "Deployment branches" rule must allow only `main`: then a workflow file changed on
    # another branch (anyone with write access can push one and start it with workflow_dispatch) never
    # receives the signing key. Delete the repository-level secret after moving it.
    environment: catalog-signing
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the published catalog
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: catalog
          path: published
          persist-credentials: false

      - name: Download the unsigned catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-unsigned
          path: out

      - name: Validate again (independently of the fetch job)
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          args=(validate --repo-root . --catalog out/drivers.json --allow-downgrade "${ALLOW_DOWNGRADE:-}")
          if [ -f published/catalog/drivers.json ]; then args+=(--previous published/catalog/drivers.json); fi
          python3 -I tools/driver-catalog/catalog.py "${args[@]}"

      - name: Build the signing tool (locked dependencies)
        run: cargo build --release --locked --manifest-path tools/fanrgb-release/Cargo.toml

      - name: Sign with the catalog key
        env:
          CATALOG_MINISIGN_KEY: ${{ secrets.CATALOG_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOG_MINISIGN_KEY:-}" ]; then echo "::error::the CATALOG_MINISIGN_KEY secret is not set"; exit 1; fi
          primary=$(grep -E '^pub const PRIMARY' src/drivers/catalog/keys.rs | grep -oE 'RW[A-Za-z0-9+/]{54}')
          tools/fanrgb-release/target/release/fanrgb-release catalog-sign --file out/drivers.json \
            --key-env CATALOG_MINISIGN_KEY --expect-pubkey "$primary"

      - name: Verify with the keys compiled into the app
        run: |
          set -euo pipefail
          keys=$(grep -oE 'RW[A-Za-z0-9+/]{54}' src/drivers/catalog/keys.rs | paste -sd, -)
          tools/fanrgb-release/target/release/fanrgb-release catalog-verify --file out/drivers.json --pubkeys "$keys"

      - name: Commit to the catalog branch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dir=published
          if [ ! -d "$dir/.git" ]; then
            rm -rf "$dir"
            git init -q -b catalog "$dir"
            git -C "$dir" remote add origin "https://github.com/${REPO}.git"
          fi
          mkdir -p "$dir/catalog"
          cp out/drivers.json out/drivers.json.minisig "$dir/catalog/"
          printf '* -text\n' > "$dir/.gitattributes"
          cat > "$dir/README.md" <<'EOF'
          # FanRGB driver catalog

          Written only by `.github/workflows/driver-catalog.yml`. `catalog/drivers.json` is signed with the
          driver-catalog minisign key (`catalog/drivers.json.minisig`); FanRGB verifies the exact bytes and
          refuses older serials. Do not edit by hand: change `catalog/manual.json` on the code branch instead.
          EOF
          serial=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["serial"])' "$dir/catalog/drivers.json")
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Driver catalog serial ${serial}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push -q origin HEAD:refs/heads/catalog
          echo "Published catalog serial ${serial}" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Track failures in issues
    needs: [fetch, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-unsigned
          path: out

      - name: Open, update or close issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH_OK: ${{ needs.fetch.result == 'success' && needs.publish.result != 'failure' && needs.publish.result != 'cancelled' }}
        run: |
          python3 -I tools/driver-catalog/catalog.py issues --report out/report.json \
            --publish-ok "$PUBLISH_OK" --run-url "$RUN_URL" --repo "$REPO"
